<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectrum Dance Academy — Admin Dashboard</title>
<style>
:root{--purple:#4a1a7a;--deep:#33115a;--orange:#e85d25;--gold:#f2b705;--ink:#2a2130;--line:#e4dcee;--ok:#1e8f5f;--err:#c0392b;--blue:#3a76b0}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Verdana,sans-serif;background:linear-gradient(180deg,#faf6ef,#f2ecf9);color:var(--ink);padding-bottom:50px}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.banner{display:block;width:100%;height:auto;border-radius:0 0 6px 6px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.admin-bar{background:var(--deep);color:#fff;text-align:center;font-size:12px;padding:6px;border-radius:8px;margin:12px 0;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tab{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 6px;text-align:center;font-weight:700;color:var(--deep);cursor:pointer;font-size:15px}
.tab small{display:block;font-weight:600;color:#8a7fa0;margin-top:3px;font-size:12px}
.tab.on{background:linear-gradient(120deg,var(--orange),var(--gold));color:#fff;border-color:transparent}
.tab.on small{color:#fff}
h2.st{font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:var(--purple);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
h2.st::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card.big{border:2.5px solid var(--purple);border-radius:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:14px;color:#fff;text-align:center;padding:16px 4px;font-size:12px}
.stat b{display:block;font-size:26px}
.s1{background:linear-gradient(135deg,#e8683a,#f2b03d)}.s2{background:linear-gradient(135deg,#2b9068,#3bb273)}.s3{background:linear-gradient(135deg,#3a76b0,#4a90d9)}
input,select{padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--purple)}
input[readonly]{background:#f4f1fa;color:#655a78}
label{display:block;font-size:12px;font-weight:600;color:var(--deep);margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.stat b{font-size:20px}}
button{cursor:pointer;font-family:inherit}
.b{border:1.5px solid var(--purple);background:#fff;color:var(--purple);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.b:hover{background:var(--purple);color:#fff}
.b.ok{border-color:var(--ok);color:var(--ok)}.b.ok:hover{background:var(--ok);color:#fff}
.b.del{border-color:var(--err);color:var(--err)}.b.del:hover{background:var(--err);color:#fff}
.b.pri{background:linear-gradient(120deg,var(--orange),var(--gold));color:#fff;border:0;padding:12px;width:100%;font-size:15px}
.b.on{background:var(--purple);color:#fff}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f4f1fa;color:var(--deep);position:sticky;top:0}
.muted{color:#8a7fa0;font-size:13px;text-align:center;padding:10px}
.red{color:var(--err);font-weight:700}
.alert{background:#fdecea;border:1.5px solid var(--err);color:var(--err);border-radius:10px;padding:10px 12px;font-weight:600;margin-bottom:12px}
.pick{padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:6px;cursor:pointer;background:#fff}
.pick:hover{border-color:var(--purple);background:#f9f7fc}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;font-size:13px}
.info span{color:#8a7fa0;display:block;font-size:11px}
#modal{position:fixed;inset:0;background:rgba(20,8,40,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
#modal .box{background:#fff;border-radius:14px;padding:18px;max-width:640px;width:100%}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:10;font-size:14px;text-align:center}
#toast a{color:#7dffb0;font-weight:700;margin-left:8px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<img class="banner" src="banner.png" alt="Spectrum Dance Academy">
<div class="admin-bar">Admin Only — Dashboard</div>

<div class="tabs">
  <div class="tab" id="tab-fees" data-v="fees">Fees<small id="cFees">₹0 today</small></div>
  <div class="tab" id="tab-dues" data-v="dues">Dues<small id="cDues">—</small></div>
  <div class="tab" id="tab-students" data-v="students">Total Students<small id="cStu">—</small></div>
</div>

<!-- ===== PAYMENT REPORT (same as before; always visible, date-wise) ===== -->
<div id="reportBox">
  <h2 class="st">Payment Report <input type="date" id="repDate" style="width:auto;margin-left:auto"> <button class="b" id="btnToday">Today</button></h2>
  <div class="card big">
    <div class="stats">
      <div class="stat s1"><b id="rTotal">₹0</b>COLLECTED</div>
      <div class="stat s2"><b id="rCash">₹0</b>CASH</div>
      <div class="stat s3"><b id="rOnline">₹0</b>ONLINE</div>
    </div>
    <div id="repList" class="tw" style="margin-top:12px"></div>
  </div>
</div>

<!-- ===== FEES ===== -->
<div id="v-fees" class="hide">
  <h2 class="st">Search Student</h2>
  <div class="card">
    <input id="feeSearch" placeholder="Reg No, Name, Phone, Alternate No, Guardian Phone">
    <div id="feeResults"></div>
  </div>
  <div id="feeStudent" class="hide">
    <div class="card"><div class="info" id="feeInfo"></div>
      <div class="row" style="margin-top:12px">
        <button class="b ok" id="btnUpdDues">Update Dues</button>
        <button class="b" id="btnAddPay">+ Add Payment</button>
      </div>
    </div>
    <div id="feeForm"></div>
    <h2 class="st">Payment History</h2>
    <div class="card tw" id="payHistory"></div>
  </div>
</div>

<!-- ===== DUES ===== -->
<div id="v-dues" class="hide">
  <h2 class="st">Dues</h2>
  <div id="overdueAlert"></div>
  <div class="card">
    <input id="duesSearch" placeholder="Reg No, Name, Phone, Alternate No">
    <div class="row" style="margin-top:10px" id="duesFilters">
      <button class="b on" data-f="all">All</button>
      <button class="b" data-f="admission">Admission Dues</button>
      <button class="b" data-f="monthly">Monthly Dues</button>
      <button class="b" data-f="overdue">Overdue</button>
    </div>
  </div>
  <div class="card tw" id="duesList"></div>
</div>

<!-- ===== STUDENTS ===== -->
<div id="v-students" class="hide">
  <h2 class="st">Total Students</h2>
  <div class="card"><input id="stuSearch" placeholder="Search any detail"></div>
  <div class="card tw" id="stuList" style="max-height:70vh"></div>
</div>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
var WEB_APP_URL="https://script.google.com/macros/s/AKfycbzLUghnI4QXXcElOVTa43Ify1MOPo9kWbYHKdmUvO0NRPzU4qK3AvTGy2gVOPoW3py8Uw/exec";
var ADMIN_KEY=new URLSearchParams(location.search).get("key")||"sda2026";
function api(a,p){p=p||{};p.key=ADMIN_KEY;p.adminKey=ADMIN_KEY;
  return fetch(WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:a,payload:p})}).then(function(r){return r.json()});}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function inr(n){return "₹"+(Number(n)||0).toLocaleString("en-IN")}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function toast(msg,link){var t=$("toast");t.innerHTML=esc(msg)+(link?'<a target="_blank" href="'+esc(link)+'">Open WhatsApp</a>':"");t.style.display="block";clearTimeout(t._t);t._t=setTimeout(function(){t.style.display="none"},link?12000:3500)}
function waDone(res,okMsg){ // same WhatsApp behaviour as the old receipt page
  if(res.whatsapp&&!res.whatsapp.sent&&res.whatsapp.link){window.open(res.whatsapp.link,"_blank");toast(okMsg,res.whatsapp.link)}
  else toast(okMsg+(res.whatsapp&&res.whatsapp.sent?" · WhatsApp sent":""));}
function ask(msg){return confirm(msg)}
function modal(html){$("modalBox").innerHTML=html;$("modal").style.display="flex"}
function closeModal(){$("modal").style.display="none"}
$("modal").addEventListener("click",function(e){if(e.target===this)closeModal()});

// ---- helpers to read a student row regardless of exact header spelling ----
function g(row,re){for(var k in row){if(re.test(k))return row[k]}return ""}
var F={reg:/reg/i,name:/^(student\s*)?name/i,phone:/^(mobile|phone|contact)|^(student\s*)?(mobile|phone)/i,adm:/admission\s*date|^date/i,batch:/batch|time/i,cat:/categor/i,dur:/^duration$/i,durT:/duration\s*type/i,exp:/expiry/i,dues:/^dues$/i};
function matchStu(row,q){q=q.toLowerCase().trim();if(!q)return true;
  for(var k in row){if(/reg|name|phone|mobile|alternate|guardian|contact/i.test(k)&&String(row[k]).toLowerCase().indexOf(q)>-1)return true}return false}

var students=[],headers=[],cur=null;

// ---- navigation ----
function show(v){["fees","dues","students"].forEach(function(x){$("v-"+x).classList.toggle("hide",x!==v);$("tab-"+x).classList.toggle("on",x===v)});
  if(v==="dues")loadDues();if(v==="students")loadStudents();}
document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){show(t.dataset.v)})});

// ---- payment report ----
function loadReport(){var d=$("repDate").value||today();
  api("getPaymentReport",{date:d}).then(function(r){
    if(r.status!=="success")throw new Error(r.message||"Failed");
    $("rTotal").textContent=inr(r.total);$("rCash").textContent=inr(r.cash);$("rOnline").textContent=inr(r.online);
    if(d===today())$("cFees").textContent=inr(r.total)+" today";
    var rows=r.payments||[];
    $("repList").innerHTML=rows.length?'<table><tr><th>Reg No</th><th>Name</th><th>Paid</th><th>Mode</th></tr>'+rows.map(function(p){return"<tr><td>"+esc(p.regNo)+"</td><td>"+esc(p.studentName)+"</td><td>"+inr(p.paid)+"</td><td>"+esc(p.mode)+"</td></tr>"}).join("")+"</table>":'<div class="muted">Is date par koi payment nahi.</div>';
  }).catch(function(e){["rTotal","rCash","rOnline"].forEach(function(i){$(i).textContent="₹0"});$("repList").innerHTML='<div class="muted">Report not available ('+esc(e.message)+')</div>'});}
$("repDate").value=today();$("repDate").addEventListener("change",loadReport);
$("btnToday").addEventListener("click",function(){$("repDate").value=today();loadReport()});

// ---- load all students (cache) ----
function fetchStudents(){return api("getStudents",{}).then(function(r){
  if(r.status!=="success")throw new Error(r.message||"Failed to load students");
  students=r.rows||[];headers=r.headers||(students[0]?Object.keys(students[0]):[]);
  $("cStu").textContent=students.length+" students";
  var d=students.filter(function(s){return Number(g(s,F.dues))>0}).length;$("cDues").textContent=d+" pending";return students})}

// ================= FEES =================
$("feeSearch").addEventListener("input",function(){
  var q=this.value;if(!q.trim()){$("feeResults").innerHTML="";return}
  var go=function(){var m=students.filter(function(s){return matchStu(s,q)}).slice(0,15);
    $("feeResults").innerHTML=m.length?m.map(function(s,i){return'<div class="pick" data-i="'+students.indexOf(s)+'"><b>'+esc(g(s,F.name))+'</b> · '+esc(g(s,F.reg))+' · '+esc(g(s,F.phone))+'</div>'}).join(""):'<div class="muted">Koi student nahi mila.</div>';
    document.querySelectorAll("#feeResults .pick").forEach(function(p){p.addEventListener("click",function(){pickStudent(students[+p.dataset.i])})})};
  students.length?go():fetchStudents().then(go).catch(function(e){toast(e.message)});});

function pickStudent(s){cur=s;$("feeResults").innerHTML="";$("feeSearch").value="";$("feeForm").innerHTML="";$("feeStudent").classList.remove("hide");
  var items=[["Reg No",g(s,F.reg)],["Name",g(s,F.name)],["Phone",g(s,F.phone)],["Admission Date",g(s,F.adm)],["Batch Time",g(s,F.batch)],["Category",g(s,F.cat)],["Duration",g(s,F.dur)+" "+g(s,F.durT)],["Expiry Date",g(s,F.exp)],["Dues",inr(g(s,F.dues))]];
  $("feeInfo").innerHTML=items.map(function(x){return"<div><span>"+x[0]+"</span><b"+(x[0]==="Dues"&&Number(g(s,F.dues))>0?' class="red"':"")+">"+esc(x[1])+"</b></div>"}).join("");
  $("btnUpdDues").classList.toggle("hide",!(Number(g(s,F.dues))>0));loadHistory();}

function loadHistory(){var reg=g(cur,F.reg);$("payHistory").innerHTML='<div class="muted">Loading...</div>';
  api("getPayments",{regNo:reg}).then(function(r){
    if(r.status!=="success")throw new Error(r.message);var rows=r.payments||[];
    $("payHistory").innerHTML=rows.length?'<table><tr><th>Payment Date</th><th>Session Date</th><th>Duration</th><th>Expiry</th><th>Paid</th><th>Dues</th><th></th></tr>'+rows.map(function(p,i){
      return"<tr><td>"+esc(p.paymentDate)+"</td><td>"+esc(p.sessionDate)+"</td><td>"+esc(p.duration)+" "+esc(p.durationType)+"</td><td>"+esc(p.expiryDate)+"</td><td>"+inr(p.paid)+"</td><td>"+inr(p.dues)+'</td><td><button class="b ok" data-a="wa" data-i="'+i+'">WhatsApp</button> <button class="b" data-a="ed" data-i="'+i+'">Edit</button> <button class="b del" data-a="dl" data-i="'+i+'">Delete</button></td></tr>'}).join("")+"</table>":'<div class="muted">Is student ki koi payment history nahi.</div>';
    $("payHistory").querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(){var p=rows[+b.dataset.i],a=b.dataset.a;
      if(a==="wa")api("resendPaymentWhatsapp",{regNo:reg,paymentId:p.id}).then(function(r){r.status==="success"?waDone(r,"Message ready"):toast(r.message)});
      if(a==="ed")editPayment(p);
      if(a==="dl"&&ask("Kya aap sach mai is payment record ko delete karna chahte hai?"))api("deletePayment",{regNo:reg,paymentId:p.id}).then(function(r){toast(r.status==="success"?"Payment deleted":r.message);loadHistory();loadReport();fetchStudents()})})})
  }).catch(function(e){$("payHistory").innerHTML='<div class="muted">'+esc(e.message)+"</div>"})}

function editPayment(p){var keys=[["paymentDate","Payment Date"],["sessionDate","Session Date"],["duration","Duration"],["durationType","Duration Type"],["expiryDate","Expiry Date"],["total","Total Amount"],["paid","Paid Amount"],["dues","Dues"],["mode","Payment Mode"]];
  modal("<h3>Edit Payment</h3><div class='grid'>"+keys.map(function(k){return"<div><label>"+k[1]+"</label><input data-k='"+k[0]+"' value='"+esc(p[k[0]])+"'></div>"}).join("")+"</div><div class='row' style='margin-top:14px'><button class='b ok' id='mSave'>Save</button><button class='b' id='mCancel'>Cancel</button></div>");
  $("mCancel").onclick=closeModal;
  $("mSave").onclick=function(){var d={};document.querySelectorAll("#modalBox input").forEach(function(i){d[i.dataset.k]=i.value});
    api("updatePayment",{regNo:g(cur,F.reg),paymentId:p.id,data:d}).then(function(r){closeModal();toast(r.status==="success"?"Payment updated":r.message);loadHistory();loadReport()})}}

// payment form: used for both "Add Payment" and "Update Dues"
function payForm(mode){var s=cur,isDues=mode==="dues",dues0=Number(g(s,F.dues))||0;
  $("feeForm").innerHTML='<div class="card"><b>'+(isDues?"Update Dues":"Add Payment")+'</b><div class="grid" style="margin-top:10px">'+
  '<div><label>Payment Date</label><input type="date" id="fPD" value="'+today()+'"></div>'+
  '<div><label>Session Date</label><input type="date" id="fSD" value="'+esc(toISO(g(s,F.exp)))+'"></div>'+
  '<div><label>Duration</label><input id="fDur" type="number" min="0" value="'+esc(g(s,F.dur))+'"></div>'+
  '<div><label>Duration Type</label><select id="fDT">'+["Month","Days","Year"].map(function(t){return"<option"+(new RegExp(t,"i").test(g(s,F.durT))?" selected":"")+">"+t+"</option>"}).join("")+'</select></div>'+
  '<div><label>Total Amount (₹)</label><input id="fTot" type="number" min="0" step="0.01" '+(isDues?'value="'+dues0+'" readonly':"")+'></div>'+
  '<div><label>Paid Amount (₹)</label><input id="fPaid" type="number" min="0" step="0.01"></div>'+
  '<div><label>Dues (₹)</label><input id="fDues" readonly value="0.00"></div>'+
  '<div><label>Payment Mode</label><select id="fMode"><option>Cash</option><option>Online</option></select></div>'+
  '<div id="fDDw" class="hide"><label>Dues Date (deadline)</label><input type="date" id="fDD"></div></div>'+
  '<button class="b pri" id="fSubmit" style="margin-top:14px">Submit &amp; Send WhatsApp</button></div>';
  function calc(){var d=(parseFloat($("fTot").value)||0)-(parseFloat($("fPaid").value)||0);$("fDues").value=d.toFixed(2);$("fDDw").classList.toggle("hide",!(d>0))}
  $("fTot").oninput=calc;$("fPaid").oninput=calc;calc();
  $("fSubmit").onclick=function(){var b=this;if(!$("fTot").value||$("fPaid").value===""){toast("Total aur Paid amount bhariye");return}
    b.disabled=true;b.textContent="Submitting...";
    api(isDues?"payDues":"submitPayment",{regNo:g(s,F.reg),studentName:g(s,F.name),mobile:g(s,F.phone),duration:$("fDur").value,durationType:$("fDT").value,
      paymentDate:$("fPD").value,sessionDate:$("fSD").value,expiryDate:g(s,F.exp),totalAmount:$("fTot").value,paidAmount:$("fPaid").value,
      duesDate:$("fDD").value,paymentMode:$("fMode").value,paymentSettlement:g(s,/settlement/i),discountAmount:"0",additionalCharges:[]}).then(function(r){
      if(r.status!=="success"){toast(r.message||"Failed");b.disabled=false;b.textContent="Submit & Send WhatsApp";return}
      $("feeForm").innerHTML="";waDone(r,"Payment saved");loadHistory();loadReport();fetchStudents().then(function(){var n=students.filter(function(x){return g(x,F.reg)==g(s,F.reg)})[0];if(n)pickStudent(n)})
    }).catch(function(e){toast(e.message);b.disabled=false;b.textContent="Submit & Send WhatsApp"})}}
function toISO(s){if(!s)return"";var m=String(s).match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);return m?m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2):(/^\d{4}-/.test(s)?String(s).slice(0,10):"")}
$("btnAddPay").addEventListener("click",function(){payForm("add")});
$("btnUpdDues").addEventListener("click",function(){payForm("dues")});

// ================= DUES =================
var duesRows=[],duesF="all";
function loadDues(){$("duesList").innerHTML='<div class="muted">Loading...</div>';
  api("getDues",{}).then(function(r){if(r.status!=="success")throw new Error(r.message||"Failed");duesRows=r.dues||[];$("cDues").textContent=duesRows.length+" pending";renderDues()}).catch(function(e){$("duesList").innerHTML='<div class="muted">'+esc(e.message)+"</div>"})}
function isOver(d){return d.dueDate&&toISO(d.dueDate)&&toISO(d.dueDate)<today()}
function renderDues(){var q=$("duesSearch").value;
  var over=duesRows.filter(isOver);
  $("overdueAlert").innerHTML=over.length?'<div class="alert">⚠ '+over.length+" student(s) ka dues date nikal chuka hai: "+over.slice(0,5).map(function(d){return esc(d.studentName)}).join(", ")+(over.length>5?"...":"")+"</div>":"";
  var rows=duesRows.filter(function(d){
    if(duesF==="admission"&&!/admission/i.test(d.type))return false;if(duesF==="monthly"&&!/month/i.test(d.type))return false;if(duesF==="overdue"&&!isOver(d))return false;
    return matchStu({regNo:d.regNo,name:d.studentName,phone:d.mobile,alternate:d.alternate},q)});
  $("duesList").innerHTML=rows.length?'<table><tr><th>Reg No</th><th>Name</th><th>Phone</th><th>Type</th><th>Dues</th><th>Dues Date</th><th></th></tr>'+rows.map(function(d,i){
    return"<tr><td>"+esc(d.regNo)+"</td><td>"+esc(d.studentName)+"</td><td>"+esc(d.mobile)+"</td><td>"+esc(d.type)+'</td><td class="red">'+inr(d.dues)+"</td><td"+(isOver(d)?' class="red"':"")+">"+esc(d.dueDate||"—")+(isOver(d)?" ⚠":"")+'</td><td><button class="b ok" data-r="'+esc(d.regNo)+'">Update</button></td></tr>'}).join("")+"</table>":'<div class="muted">Koi dues nahi mila.</div>';
  $("duesList").querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(){
    fetchStudents().then(function(){var s=students.filter(function(x){return g(x,F.reg)==b.dataset.r})[0];if(!s){toast("Student nahi mila");return}show("fees");pickStudent(s);payForm("dues");window.scrollTo(0,0)})})})}
$("duesSearch").addEventListener("input",renderDues);
document.querySelectorAll("#duesFilters button").forEach(function(b){b.addEventListener("click",function(){duesF=b.dataset.f;document.querySelectorAll("#duesFilters button").forEach(function(x){x.classList.toggle("on",x===b)});renderDues()})});

// ================= TOTAL STUDENTS =================
function loadStudents(){$("stuList").innerHTML='<div class="muted">Loading...</div>';fetchStudents().then(renderStudents).catch(function(e){$("stuList").innerHTML='<div class="muted">'+esc(e.message)+"</div>"})}
function renderStudents(){var q=$("stuSearch").value.toLowerCase();
  var rows=students.filter(function(s){return!q||headers.some(function(h){return String(s[h]).toLowerCase().indexOf(q)>-1})});
  $("stuList").innerHTML=rows.length?"<table><tr><th></th>"+headers.map(function(h){return"<th>"+esc(h)+"</th>"}).join("")+"</tr>"+rows.map(function(s){
    return'<tr><td><button class="b" data-a="e" data-r="'+esc(g(s,F.reg))+'">Edit</button> <button class="b del" data-a="d" data-r="'+esc(g(s,F.reg))+'">Delete</button></td>'+headers.map(function(h){return"<td>"+esc(s[h])+"</td>"}).join("")+"</tr>"}).join("")+"</table>":'<div class="muted">Koi student nahi.</div>';
  $("stuList").querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(){var s=students.filter(function(x){return g(x,F.reg)==b.dataset.r})[0];
    if(b.dataset.a==="e")editStudent(s);
    else if(ask("Kya aap sach mai is student ko delete karna chahte hai? Data Google Sheet se bhi hat jayega."))api("deleteStudent",{regNo:b.dataset.r}).then(function(r){toast(r.status==="success"?"Student deleted":r.message);loadStudents()})})})}
$("stuSearch").addEventListener("input",renderStudents);
function editStudent(s){
  modal("<h3>Edit Student — "+esc(g(s,F.name))+"</h3><div class='grid'>"+headers.map(function(h,i){return"<div><label>"+esc(h)+"</label><input data-h='"+esc(h)+"' value='"+esc(s[h])+"'></div>"}).join("")+"</div><div class='row' style='margin-top:14px'><button class='b ok' id='mSave'>Save</button><button class='b' id='mCancel'>Cancel</button></div>");
  $("mCancel").onclick=closeModal;
  $("mSave").onclick=function(){var d={};document.querySelectorAll("#modalBox input").forEach(function(i){d[i.dataset.h]=i.value});
    api("updateStudent",{regNo:g(s,F.reg),data:d}).then(function(r){closeModal();toast(r.status==="success"?"Student updated":r.message);loadStudents()})}}

// ---- init ----
show("fees");loadReport();fetchStudents().catch(function(){});
</script>
